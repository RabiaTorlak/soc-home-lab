<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- title -->
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#64748b">SOC Home Lab — Wazuh SIEM + Python SOAR</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#64748b">Detection → Automated Response → Visualization → Documentation</text>

  <!-- network boundary -->
  <rect x="24" y="80" width="892" height="360" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="42" y="102" font-size="12" fill="#64748b">VMware NAT · 192.168.222.0/24</text>

  <!-- Kali -->
  <rect x="48" y="206" width="170" height="112" rx="10" fill="#be123c"/>
  <text x="133" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Kali Linux</text>
  <text x="133" y="258" text-anchor="middle" font-size="12" fill="#ffffff">Attacker · .128</text>
  <text x="133" y="282" text-anchor="middle" font-size="11" fill="#fecdd3">nmap · hydra</text>
  <text x="133" y="300" text-anchor="middle" font-size="11" fill="#fecdd3">brute-force / scan</text>

  <!-- Windows endpoint -->
  <rect x="724" y="206" width="168" height="112" rx="10" fill="#0d9488"/>
  <text x="808" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Windows 11</text>
  <text x="808" y="258" text-anchor="middle" font-size="12" fill="#ffffff">Endpoint (LTSC)</text>
  <text x="808" y="282" text-anchor="middle" font-size="11" fill="#99f6e4">Sysmon +</text>
  <text x="808" y="300" text-anchor="middle" font-size="11" fill="#99f6e4">Wazuh Agent</text>

  <!-- SOC server -->
  <rect x="300" y="126" width="336" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="468" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ubuntu SOC Server · .130</text>

  <rect x="320" y="166" width="296" height="52" rx="8" fill="#2563eb"/>
  <text x="468" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Wazuh SIEM</text>
  <text x="468" y="207" text-anchor="middle" font-size="11" fill="#dbeafe">Indexer · Manager · Dashboard</text>

  <rect x="320" y="226" width="296" height="52" rx="8" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <text x="468" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">★ Python SOAR  (this repo)</text>
  <text x="468" y="267" text-anchor="middle" font-size="11" fill="#ede9fe">auto-block · IOC enrich · case files</text>

  <rect x="320" y="286" width="142" height="52" rx="8" fill="#ea580c"/>
  <text x="391" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Grafana</text>
  <text x="391" y="326" text-anchor="middle" font-size="10" fill="#ffedd5">SOC dashboard</text>

  <rect x="474" y="286" width="142" height="52" rx="8" fill="#0891b2"/>
  <text x="545" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">NetAlertX</text>
  <text x="545" y="326" text-anchor="middle" font-size="10" fill="#cffafe">network discovery</text>

  <!-- Kali <-> SOC arrows -->
  <line x1="220" y1="244" x2="294" y2="244" stroke="#ef4444" stroke-width="2"/>
  <polygon points="294,244 285,240 285,248" fill="#ef4444"/>
  <text x="257" y="238" text-anchor="middle" font-size="10" fill="#ef4444">attack</text>

  <line x1="294" y1="286" x2="220" y2="286" stroke="#22c55e" stroke-width="2"/>
  <polygon points="220,286 229,282 229,290" fill="#22c55e"/>
  <text x="257" y="302" text-anchor="middle" font-size="10" fill="#22c55e">auto-block</text>

  <!-- Endpoint -> SOC -->
  <line x1="722" y1="262" x2="638" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="638,262 647,258 647,266" fill="#94a3b8"/>
  <text x="680" y="254" text-anchor="middle" font-size="10" fill="#64748b">logs / telemetry</text>

  <!-- pipeline -->
  <rect x="46" y="476" width="180" height="46" rx="23" fill="#2563eb"/>
  <text x="136" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1 · Detect</text>

  <rect x="268" y="476" width="180" height="46" rx="23" fill="#7c3aed"/>
  <text x="358" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2 · Automate</text>

  <rect x="490" y="476" width="180" height="46" rx="23" fill="#ea580c"/>
  <text x="580" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3 · Visualize</text>

  <rect x="712" y="476" width="180" height="46" rx="23" fill="#475569"/>
  <text x="802" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4 · Document</text>

  <line x1="226" y1="499" x2="264" y2="499" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="264,499 255,495 255,503" fill="#94a3b8"/>
  <line x1="448" y1="499" x2="486" y2="499" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="486,499 477,495 477,503" fill="#94a3b8"/>
  <line x1="670" y1="499" x2="708" y2="499" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="708,499 699,495 699,503" fill="#94a3b8"/>
</svg>
