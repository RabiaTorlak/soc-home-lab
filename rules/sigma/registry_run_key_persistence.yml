title: Registry Run Key Persistence via reg.exe
id: 7a1c2e40-1b11-4f21-9a3d-2c9f0a11b108
status: experimental
description: reg.exe ile otomatik başlatma (Run/RunOnce) anahtarı oluşturulmasını tespit eder.
author: RabiaTorlak
date: 2026/11/22
references:
  - https://attack.mitre.org/techniques/T1547/001/
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
      - '\CurrentVersion\Run'
      - '\RunOnce'
  condition: selection
falsepositives:
  - Yazılım yükleyicileri (legitimate installers)
level: high
