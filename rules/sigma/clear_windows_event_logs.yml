title: Windows Event Log Temizleme
id: 3f8b6d22-9c44-4a71-8e2b-6a1f0c22b109
status: experimental
description: wevtutil cl veya Clear-EventLog ile olay günlüklerinin temizlenmesini tespit eder (anti-forensics).
author: RabiaTorlak
date: 2026/11/22
references:
  - https://attack.mitre.org/techniques/T1070/001/
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log'
  selection_ps:
    CommandLine|contains: 'Clear-EventLog'
  condition: selection_wevtutil or selection_ps
falsepositives:
  - Planlı günlük bakımı (nadir)
level: high
