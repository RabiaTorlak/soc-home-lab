title: Remote System Discovery
id: 5d2a7e91-4c33-4b88-9f1a-7b3e0d33b110
status: experimental
description: net view / nltest /dclist ile uzak sistem ve domain denetleyici keşfini tespit eder.
author: RabiaTorlak
date: 2026/11/22
references:
  - https://attack.mitre.org/techniques/T1018/
tags:
  - attack.discovery
  - attack.t1018
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'net view'
      - 'nltest /dclist'
      - 'net group "domain computers"'
  condition: selection
falsepositives:
  - Yönetici envanter betikleri
level: medium
